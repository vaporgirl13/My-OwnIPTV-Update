name: Actualizar listas
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Actualizar enlaces
        run: python actualizar_listas.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in My_Own_IPTV.m3u8 lista_favoritos_filtrada.m3u8 informe_actualizacion.md; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar enlaces de iptv-org"
            git push
          fi
